name: configured-toolchain
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  configured-toolchain:
    name: configured-toolchain (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Real standalone C and C++ capture and frozen verification
        env:
          MANTIS_PROVENANCE_TEST_ROOT: ${{ runner.temp }}/configured provenance
          MANTIS_PROVENANCE_REVISION: ${{ github.sha }}
        run: python3 -B tests/ci/toolchain_provenance_test.py
      # Private command receipts/cache metadata are deliberately not uploaded.
      # This is not integration into Architecture or a product toolchain report.
