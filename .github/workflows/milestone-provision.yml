name: milestone-provision

on:
  issues:
    types: [labeled]
  pull_request:
    paths:
      - .github/workflows/milestone-provision.yml
      - scripts/github_milestones.py
      - tests/test_github_milestones.py

permissions: {}

concurrency:
  group: milestone-provision-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m unittest discover -s tests -p 'test_github_milestones.py' -v
      - run: python3 -m py_compile scripts/github_milestones.py

  provision:
    if: >-
      github.event_name == 'issues' &&
      github.repository == 'martinkoenig/mantis-studio' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'automation:create-milestone' &&
      github.event.sender.id == 13789807 &&
      github.event.issue.user.id == 13789807 &&
      github.event.issue.state == 'open' &&
      !github.event.issue.pull_request
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Process owner-authorized milestone request
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 scripts/github_milestones.py
