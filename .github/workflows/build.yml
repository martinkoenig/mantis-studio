name: architecture
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel obsolete validations for the same ref/event while preserving
# distinct push vs PR merge checks and manually requested runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id || github.ref) }}
  cancel-in-progress: true

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        studio: ["ON", "OFF"]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes cmake ninja-build g++ libsqlite3-dev protobuf-compiler libprotobuf-dev nlohmann-json3-dev python3-protobuf libopencv-dev libopencv-contrib-dev qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtqml-workerscript gdb
          dpkg-query -W libopencv-dev libopencv-contrib-dev | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMANTIS_BUILD_STUDIO=${{ matrix.studio }} -DPython3_EXECUTABLE=/usr/bin/python3
      - name: Build
        run: cmake --build build/ci --parallel 4
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
      - name: Record exact review revision
        if: ${{ matrix.studio == 'ON' }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path('build/ci/ui-m2a')
          out.mkdir(parents=True, exist_ok=True)
          out.joinpath('revision.json').write_text(json.dumps({
              'sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'runner': '${{ matrix.runner }}', 'studio': '${{ matrix.studio }}'
          }, indent=2) + '\n')
          receipt = Path('build/ci/ui-m2a/revision.json').read_text()
          devices = Path('build/ci/ui-m2b')
          devices.mkdir(parents=True, exist_ok=True)
          devices.joinpath('revision.json').write_text(receipt)
          retry = Path('build/ci/ui-m3a')
          retry.mkdir(parents=True, exist_ok=True)
          retry.joinpath('revision.json').write_text(receipt)
          PY
      - name: Repeat Home, Projects and Devices transition regressions
        if: ${{ matrix.studio == 'ON' }}
        run: |
          cp build/ci/Testing/Temporary/LastTest.log build/ci/ui-m1/full-ctest.log
          ctest --test-dir build/ci -R '^(studio-home-qml|studio-projects-qml|studio-projects-resize|studio-projects-scroll|studio-devices-qml|studio-devices-stress|studio-ui-m0-qml)$' --repeat until-fail:3 --output-on-failure
      - name: Diagnose a failed UI route test
        if: ${{ failure() && matrix.studio == 'ON' }}
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          mkdir -p build/ci/ui-m2a/diagnostic
          for attempt in $(seq 1 10); do
            gdb -batch -ex run -ex 'thread apply all bt full' -ex 'print (char *)qt_v4StackTraceForEngine(routeDebugEngine)' --args build/ci/bin/mantis-studio-ui-m0-tests build/ci/ui-m2a/diagnostic > "build/ci/ui-m2a/diagnostic/route-$attempt.log" 2>&1
            if grep -Eq 'received signal|Program terminated with signal' "build/ci/ui-m2a/diagnostic/route-$attempt.log"; then
              cat "build/ci/ui-m2a/diagnostic/route-$attempt.log"
              break
            fi
          done
      - name: Upload UI review evidence
        if: ${{ always() && matrix.studio == 'ON' }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-m0-${{ matrix.runner }}
          retention-days: 30
          path: |
            build/ci/ui-m0/
            build/ci/ui-m1/
            build/ci/ui-m2a/
            build/ci/ui-m2b/
            build/ci/ui-m3a/
            build/ci/Testing/Temporary/LastTest.log
            docs/ui/evidence/

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install --assume-yes cmake ninja-build g++ libsqlite3-dev protobuf-compiler libprotobuf-dev nlohmann-json3-dev python3-protobuf libopencv-dev libopencv-contrib-dev
          dpkg-query -W libopencv-dev libopencv-contrib-dev | tee -a "$GITHUB_STEP_SUMMARY"
      - run: cmake --preset sanitizers -DPython3_EXECUTABLE=/usr/bin/python3 && cmake --build --preset sanitizers --parallel 4
      - run: ctest --test-dir build/sanitizers --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
