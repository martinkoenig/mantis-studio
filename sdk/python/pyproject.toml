[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1", "protoc-wheel-0==21.11", "protobuf==3.20.0"]
build-backend = "_build_backend"
backend-path = ["."]
[project]
name = "mantis-studio-client"
version = "0.1.0"
description = "Local protocol client for the Mantis Studio architecture skeleton"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["protobuf>=3.20,<7"]
[tool.setuptools]
packages = ["mantis"]
[tool.setuptools.package-data]
mantis = ["mantis.proto", "_provenance.json"]
