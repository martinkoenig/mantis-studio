name: architecture
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        studio: ["ON", "OFF"]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes cmake ninja-build g++ libsqlite3-dev protobuf-compiler libprotobuf-dev nlohmann-json3-dev python3-protobuf libopencv-dev libopencv-contrib-dev qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtqml-workerscript
          dpkg-query -W libopencv-dev libopencv-contrib-dev | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMANTIS_BUILD_STUDIO=${{ matrix.studio }} -DPython3_EXECUTABLE=/usr/bin/python3
      - name: Build
        run: cmake --build build/ci --parallel 4
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
      - name: Upload UI review evidence
        if: ${{ always() && matrix.studio == 'ON' }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-m0-${{ matrix.runner }}
          retention-days: 30
          path: |
            build/ci/ui-m0/
            build/ci/Testing/Temporary/LastTest.log
            docs/ui/evidence/

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install --assume-yes cmake ninja-build g++ libsqlite3-dev protobuf-compiler libprotobuf-dev nlohmann-json3-dev python3-protobuf libopencv-dev libopencv-contrib-dev
          dpkg-query -W libopencv-dev libopencv-contrib-dev | tee -a "$GITHUB_STEP_SUMMARY"
      - run: cmake --preset sanitizers -DPython3_EXECUTABLE=/usr/bin/python3 && cmake --build --preset sanitizers --parallel 4
      - run: ctest --test-dir build/sanitizers --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
